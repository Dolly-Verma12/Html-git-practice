<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <style>
    .cont{
        width: 500px;
        height: 550px;
        position: relative;
       
        background-color: pink;
        align-items: center;
    }
    .box{
        width: 50px;
        height: 50px;
        background-color: brown;
         animation: move 3s  infinite;
         transform-origin: 15px 65px;
        border-radius: 50%;
        position: absolute;

    }
    @keyframes move{
         from{
            transform: rotateX(0deg);
            
        }
        to{
            transform: rotateY(360deg);
        }
       
  
    }
   </style>
    <title>HTML</title>
</head>
<body>
    <div class="cont">
<div class="box">

    </div>
    </div>
    
</body>
</html>
