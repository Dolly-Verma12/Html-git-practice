
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
        }

        input {
            padding: 8px;
        }

        button {
            padding: 8px;
            cursor: pointer;
        }

        ul {
            width: 300px;
            margin: 20px auto;
            padding: 0;
        }

        li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            list-style: none;
            background-color: lightgray;
            padding: 10px;
            margin-bottom: 10px;
        }

        .delete {
            background-color: red;
            color: white;
            border: none;
        }
    </style>
</head>

<body>

    <h1>-- TO DO LIST --</h1>

    <input type="text" id="inputTask" placeholder="Enter your task">
    <button onclick="Add()">Add</button>

    <ul id="task"></ul>

    <script>
        function Add() {
            let input = document.getElementById("inputTask");
            let taskName = input.value.trim();

            if (taskName === "") {
                alert("Please enter a task");
                return;
            }

            // Create list item
            let li = document.createElement("li");

            // Create task text
            let span = document.createElement("span");
            span.textContent = taskName;

            // Create delete button
            let btn = document.createElement("button");
            btn.textContent = "Delete";
            btn.className = "delete";

            // Delete task
            btn.onclick = function() {
                li.remove();
            };

            // Add text and button to li
            li.appendChild(span);
            li.appendChild(btn);

            // Show li inside ul
            document.getElementById("task").appendChild(li);

            // Clear input box
            input.value = "";
        }
    </script>

</body>
</html>
