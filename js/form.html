<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
 <form onsubmit="return validate()">
<input type="text" id="un"><br>
<input type="password" id="pass"><br>
<button type="submit">submit</button>
<p id="msg"></p>
 </form>

   <script>
     function validate(){
        let user=document.getElementById("un").value.trim();
        let pas=document.getElementById("pass").value;
        let msg=document.getElementById("msg");
         
        if(user===""){
            msg.innerHTML="user name enter ";
            return false;
        }
        if(pas.length<8){
            msg.innerHTML="password ";
            return false;
        }
        msg.innerHTML="sucess";
        return false;
    }
   </script>
</body>
</html>
